version: "3.9"

services:
  # ─── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: runtime
    container_name: astra-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://astra:astra_secret@postgres:5432/astra
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app          # Hot-reload in dev
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --loop uvloop
    networks:
      - astra-net

  # ─── Migrations (one-shot) ────────────────────────────────────────────────
  migrate:
    build:
      context: .
      target: runtime
    container_name: astra-migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://astra:astra_secret@postgres:5432/astra
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    networks:
      - astra-net
    restart: "no"

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: astra-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: astra
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - astra-net

  # ─── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: astra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astra-net

  # ─── Qdrant (Vector DB) ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: astra-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - astra-net

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  astra-net:
    driver: bridge
